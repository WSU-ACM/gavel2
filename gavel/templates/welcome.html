{% extends "layout.html" %}
{% block title %}Welcome{% endblock %}
{% block content %}
  <div class="container">
    <div class="w-full">
      <div class="text-32 text-indigo pb-2.4 md:pb-4 pt-8 md:pt-14.4">
        <h1 class="page-title">Welcome to Gavel</h1>
      </div>
      <div class="md:max-w-48 welcome-body">
        {{ content }}
      </div>
    </div>
  </div>

  <div class="container">
    <form action="/welcome/instructions" method="get" class="flex md:flex w-full md:w-16">
      <button type="submit" class="button-full">Read the instructions</button>
    </form>
  </div>
{% endblock %}
